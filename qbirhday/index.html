<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Qandeel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#0d0d12;font-family:'Inter',sans-serif;transition:background 1.4s ease;}
body.opened{background:radial-gradient(ellipse at 50% 0%,#2a1a3e 0%,#1a1228 60%,#0d0d18 100%);}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ══════════════════════════════════
   OPENING STAGE
══════════════════════════════════ */
#stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:20;transition:opacity .7s ease,transform .7s ease;
}
#stage.hide{opacity:0;transform:scale(.88);pointer-events:none;}

/* the scene: teddy left, card right */
.open-scene{
  display:flex;align-items:flex-end;justify-content:center;gap:0;
  position:relative;
}

/* ── TEDDY on envelope stage ── */
.stage-teddy{
  position:relative;z-index:5;
  animation: teddyIdle 2.8s ease-in-out infinite;
  transform-origin: bottom center;
  margin-right:-18px;
  margin-bottom:10px;
}
@keyframes teddyIdle{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-8px) rotate(2deg)}
}

/* when opening: teddy tugs the card open */
.stage-teddy.tugging{
  animation: teddyTug 0.9s cubic-bezier(.4,0,.2,1) forwards !important;
}
@keyframes teddyTug{
  0%  {transform:translateY(0) rotate(-2deg) translateX(0)}
  30% {transform:translateY(-14px) rotate(-12deg) translateX(-10px)}
  60% {transform:translateY(-8px) rotate(8deg) translateX(12px)}
  80% {transform:translateY(-4px) rotate(-4deg) translateX(6px)}
  100%{transform:translateY(0) rotate(-2deg) translateX(0) scale(1.05)}
}

/* teddy arm reaching to pull card */
.stage-teddy.tugging .arm-right{
  animation: armPull .9s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes armPull{
  0%  {transform:rotate(35deg)}
  40% {transform:rotate(80deg) translateX(8px)}
  70% {transform:rotate(50deg)}
  100%{transform:rotate(35deg)}
}

/* ── ENVELOPE ── */
.envelope-scene{
  position:relative;
  perspective:1000px;
}

.env-card{
  width:min(68vw,380px);
  background:#1e1c28;
  border:1px solid rgba(201,169,110,.25);
  border-radius:4px;
  padding:50px 40px 44px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
  position:relative;overflow:hidden;cursor:pointer;
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(201,169,110,.06) inset;
  transform-origin:left center;
  transition:transform .05s ease;
}
.env-card.swinging{
  animation: cardSwing 0.9s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes cardSwing{
  0%  {transform:rotateY(0deg)}
  25% {transform:rotateY(-8deg) scale(1.02)}
  55% {transform:rotateY(6deg) scale(1.03)}
  75% {transform:rotateY(-3deg)}
  100%{transform:rotateY(0deg) scale(1)}
}

.env-card::before{
  content:'';position:absolute;inset:14px;
  border:1px solid rgba(201,169,110,.07);border-radius:2px;pointer-events:none;
}

/* rope from teddy paw to card */
.rope{
  position:absolute;
  top: 50%;
  left: calc(50% - 18px);
  width:30px;height:3px;
  background:linear-gradient(to right,rgba(201,169,110,.6),rgba(201,169,110,.2));
  border-radius:2px;
  transform-origin:left center;
  transform:translateY(-50%) scaleX(1);
  transition:opacity .3s;
  pointer-events:none;
}

.env-label{font-size:10px;letter-spacing:.26em;color:rgba(201,169,110,.5);text-transform:uppercase;}
.env-name{font-family:'Dancing Script',cursive;font-size:clamp(40px,9vw,60px);color:#f5f0e8;letter-spacing:.04em;}
.env-seal{width:48px;height:48px;border-radius:50%;border:1px solid rgba(201,169,110,.3);display:flex;align-items:center;justify-content:center;margin-top:4px;position:relative;}
.env-seal::before{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(201,169,110,.15);}
.seal-d{width:10px;height:10px;background:#c9a96e;transform:rotate(45deg);opacity:.85;}
.env-hint{font-size:10px;letter-spacing:.2em;color:rgba(201,169,110,.35);text-transform:uppercase;animation:breathe 2.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}

/* speech bubble above teddy */
.speech-bubble{
  position:absolute;
  top:-54px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  border-radius:20px;
  padding:8px 16px;
  font-size:12px;letter-spacing:.06em;
  color:rgba(255,255,255,.8);
  white-space:nowrap;
  opacity:0;
  transition:opacity .4s ease;
}
.speech-bubble::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:rgba(255,255,255,.15);
}
.stage-teddy:hover .speech-bubble{opacity:1;}

/* ══════════════════════════════════
   FULL PAGE
══════════════════════════════════ */
#page{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .8s ease .5s;overflow:hidden;}
#page.visible{opacity:1;pointer-events:auto;}

.balloon-group{position:absolute;bottom:-20px;display:flex;align-items:flex-end;}
.balloon{position:relative;display:flex;flex-direction:column;align-items:center;animation:floatBalloon var(--dur,4s) ease-in-out var(--delay,0s) infinite;}
@keyframes floatBalloon{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}50%{transform:translateY(-28px) rotate(calc(var(--tilt,0deg)*-1))}}
.balloon svg{display:block;}
.balloon-string{width:1.5px;height:var(--sh,80px);background:rgba(255,255,255,.3);}

.sticker{position:absolute;font-size:var(--fs,32px);animation:stickerFloat var(--sd,5s) ease-in-out var(--ss,0s) infinite;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));pointer-events:none;user-select:none;}
@keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(var(--sr,0deg))}50%{transform:translateY(-16px) rotate(calc(var(--sr,0deg)+5deg))}}

.sparkle{position:absolute;pointer-events:none;animation:sparkleAnim var(--sd,3s) ease-in-out var(--ss,0s) infinite;}
@keyframes sparkleAnim{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(180deg)}}

/* center card */
.center-card{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.9);
  text-align:center;opacity:0;
  transition:opacity .9s ease 1.1s,transform .9s cubic-bezier(.2,0,.2,1) 1.1s;
  z-index:30;
}
#page.visible .center-card{opacity:1;transform:translate(-50%,-50%) scale(1);}

.card-inner{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:20px;padding:52px 56px 44px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 40px 80px rgba(0,0,0,.5);
  min-width:min(88vw,480px);
}
.orn{display:flex;align-items:center;gap:10px;width:100%;}
.orn-l{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(201,169,110,.6));}
.orn-r{flex:1;height:1px;background:linear-gradient(to left,transparent,rgba(201,169,110,.6));}
.orn-d{width:6px;height:6px;background:#c9a96e;transform:rotate(45deg);flex-shrink:0;}
.card-sub{font-size:10px;letter-spacing:.24em;color:rgba(201,169,110,.7);text-transform:uppercase;margin:18px 0 10px;}
.card-hb{font-family:'Dancing Script',cursive;font-size:clamp(48px,10vw,76px);font-weight:700;color:#fff;line-height:1.05;text-shadow:0 0 40px rgba(201,169,110,.35);}
.card-name{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,6vw,48px);font-weight:300;font-style:italic;color:#c9a96e;letter-spacing:.08em;margin-top:6px;}
.card-msg{font-family:'Cormorant Garamond',serif;font-size:clamp(15px,2.2vw,19px);font-weight:300;font-style:italic;color:rgba(255,255,255,.65);line-height:1.85;margin-top:24px;max-width:320px;}
.card-date{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.3);text-transform:uppercase;margin-top:22px;}

/* big page teddy — bottom left, still bobbing */
.page-teddy{
  position:absolute;
  bottom:20px;left:30px;
  z-index:25;
  opacity:0;transition:opacity .8s ease 1.8s;
  animation:pageTeddyBob 3.5s ease-in-out infinite;
}
#page.visible .page-teddy{opacity:1;}
@keyframes pageTeddyBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(2deg)}}

.cake-big{position:absolute;right:calc(50% - 320px);bottom:calc(50% - 260px);font-size:72px;animation:cakeBob 4s ease-in-out .5s infinite;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));opacity:0;transition:opacity .8s ease 2.2s;z-index:25;}
#page.visible .cake-big{opacity:1;}
@keyframes cakeBob{0%,100%{transform:translateY(0) rotate(5deg) scale(1)}50%{transform:translateY(-14px) rotate(-3deg) scale(1.05)}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="confetti"></div>

<!-- ═══════ OPENING STAGE ═══════ -->
<div id="stage">
  <div class="open-scene">

    <!-- TEDDY -->
    <div class="stage-teddy" id="stageTeddy">
      <div class="speech-bubble">Click me! 🐻</div>
      <svg width="130" height="150" viewBox="0 0 150 170" id="teddySVG">
        <!-- ears -->
        <circle cx="38" cy="36" r="20" fill="#b5793a"/>
        <circle cx="112" cy="36" r="20" fill="#b5793a"/>
        <circle cx="38" cy="36" r="12" fill="#d4954a"/>
        <circle cx="112" cy="36" r="12" fill="#d4954a"/>
        <!-- head -->
        <circle cx="75" cy="66" r="42" fill="#b5793a"/>
        <circle cx="75" cy="66" r="37" fill="#d4954a"/>

        <circle cx="60" cy="57" r="7" fill="#2c1a0e"/>
        <circle cx="90" cy="57" r="7" fill="#2c1a0e"/>
        <circle cx="62" cy="54" r="2.5" fill="#fff"/>
        <circle cx="92" cy="54" r="2.5" fill="#fff"/>
        <!-- nose -->
        <ellipse cx="75" cy="72" rx="9" ry="6" fill="#7a3e10"/>
        <circle cx="71" cy="71" r="2" fill="#5a2c08"/>
        <circle cx="79" cy="71" r="2" fill="#5a2c08"/>
        <!-- mouth -->
        <path d="M66 79 Q75 88 84 79" stroke="#5a2c08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- blush -->
        <ellipse cx="50" cy="72" rx="9" ry="6" fill="#ff8fa3" opacity=".45"/>
        <ellipse cx="100" cy="72" rx="9" ry="6" fill="#ff8fa3" opacity=".45"/>
        <!-- body -->
        <ellipse cx="75" cy="130" rx="34" ry="38" fill="#b5793a"/>
        <ellipse cx="75" cy="130" rx="26" ry="28" fill="#d4954a"/>
        <!-- left arm -->
        <ellipse cx="32" cy="125" rx="13" ry="20" fill="#b5793a" transform="rotate(-18 32 125)"/>
        <!-- RIGHT ARM — pulling motion, has id -->
        <g id="armRight" style="transform-origin:112px 110px;transform:rotate(35deg)">
          <ellipse cx="118" cy="110" rx="13" ry="20" fill="#b5793a"/>
        </g>
        <!-- legs -->
        <ellipse cx="57" cy="160" rx="14" ry="10" fill="#b5793a"/>
        <ellipse cx="93" cy="160" rx="14" ry="10" fill="#b5793a"/>
        <!-- belly -->
        <circle cx="75" cy="128" r="4" fill="#b5793a"/>
        <!-- heart -->
        <path d="M69 118 C69 114 75 112 75 117 C75 112 81 114 81 118 C81 123 75 128 75 128 C75 128 69 123 69 118Z" fill="#ff6b9d"/>
        <!-- bow tie -->
        <path d="M62 106 L70 112 L62 118 Z" fill="#ff6b9d"/>
        <path d="M88 106 L80 112 L88 118 Z" fill="#ff6b9d"/>
        <circle cx="75" cy="112" r="4" fill="#ff4081"/>
      </svg>
    </div>

    <!-- ENVELOPE CARD -->
    <div class="envelope-scene">
      <div class="env-card" id="envCard" onclick="openCard()">
        <div class="env-label">A special birthday greeting</div>
        <div class="env-name">Qandeel</div>
        <div class="env-seal"><div class="seal-d"></div></div>
        <div class="env-hint">✦ Click to open ✦</div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════ FULL PAGE ═══════ -->
<div id="page">

  <!-- BALLOONS left -->
  <div class="balloon-group" style="left:2%">
    <div class="balloon" style="--dur:4.2s;--delay:0s;--tilt:-8deg;margin-right:-8px">
      <svg width="58" height="74" viewBox="0 0 58 74"><ellipse cx="29" cy="30" rx="24" ry="28" fill="#ff6b9d"/><ellipse cx="22" cy="20" rx="7" ry="5" fill="rgba(255,255,255,.25)"/><path d="M29 58 Q26 66 29 72" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:110px"></div>
    </div>
    <div class="balloon" style="--dur:3.8s;--delay:.6s;--tilt:5deg">
      <svg width="52" height="66" viewBox="0 0 52 66"><ellipse cx="26" cy="27" rx="21" ry="25" fill="#a78bfa"/><ellipse cx="20" cy="18" rx="6" ry="4" fill="rgba(255,255,255,.22)"/><path d="M26 52 Q24 60 26 65" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:130px"></div>
    </div>
    <div class="balloon" style="--dur:4.6s;--delay:1.1s;--tilt:-4deg;margin-left:-6px">
      <svg width="62" height="78" viewBox="0 0 62 78"><ellipse cx="31" cy="32" rx="26" ry="30" fill="#fbbf24"/><ellipse cx="23" cy="21" rx="8" ry="5" fill="rgba(255,255,255,.25)"/><path d="M31 62 Q28 70 31 76" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:90px"></div>
    </div>
  </div>

  <!-- BALLOONS right -->
  <div class="balloon-group" style="right:2%">
    <div class="balloon" style="--dur:3.9s;--delay:.3s;--tilt:7deg;margin-right:-6px">
      <svg width="60" height="76" viewBox="0 0 60 76"><ellipse cx="30" cy="31" rx="25" ry="29" fill="#34d399"/><ellipse cx="22" cy="20" rx="7" ry="5" fill="rgba(255,255,255,.22)"/><path d="M30 60 Q27 68 30 74" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:100px"></div>
    </div>
    <div class="balloon" style="--dur:4.4s;--delay:.9s;--tilt:-6deg">
      <svg width="54" height="68" viewBox="0 0 54 68"><ellipse cx="27" cy="28" rx="22" ry="26" fill="#f87171"/><ellipse cx="20" cy="19" rx="6" ry="4" fill="rgba(255,255,255,.22)"/><path d="M27 54 Q25 62 27 66" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:120px"></div>
    </div>
    <div class="balloon" style="--dur:4.1s;--delay:1.4s;--tilt:4deg;margin-left:-8px">
      <svg width="58" height="74" viewBox="0 0 58 74"><ellipse cx="29" cy="30" rx="24" ry="28" fill="#60a5fa"/><ellipse cx="22" cy="20" rx="7" ry="5" fill="rgba(255,255,255,.25)"/><path d="M29 58 Q26 66 29 72" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg>
      <div class="balloon-string" style="--sh:95px"></div>
    </div>
  </div>

  <!-- top balloons -->
  <div style="position:absolute;top:0;left:18%;display:flex;gap:20px;align-items:flex-start">
    <div class="balloon" style="--dur:5s;--delay:.2s;--tilt:-5deg"><svg width="44" height="56" viewBox="0 0 44 56"><ellipse cx="22" cy="23" rx="18" ry="21" fill="#f9a8d4"/><ellipse cx="16" cy="15" rx="5" ry="3.5" fill="rgba(255,255,255,.25)"/><path d="M22 44 Q20 51 22 54" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg><div class="balloon-string" style="--sh:60px"></div></div>
    <div class="balloon" style="--dur:4.3s;--delay:1s;--tilt:6deg;margin-top:20px"><svg width="50" height="64" viewBox="0 0 50 64"><ellipse cx="25" cy="26" rx="20" ry="24" fill="#c9a96e"/><ellipse cx="18" cy="17" rx="6" ry="4" fill="rgba(255,255,255,.25)"/><path d="M25 50 Q23 58 25 62" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg><div class="balloon-string" style="--sh:50px"></div></div>
  </div>
  <div style="position:absolute;top:0;right:20%;display:flex;gap:16px;align-items:flex-start">
    <div class="balloon" style="--dur:4.7s;--delay:.7s;--tilt:4deg;margin-top:10px"><svg width="46" height="58" viewBox="0 0 46 58"><ellipse cx="23" cy="24" rx="19" ry="22" fill="#fb923c"/><ellipse cx="17" cy="16" rx="5" ry="3.5" fill="rgba(255,255,255,.25)"/><path d="M23 46 Q21 53 23 56" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg><div class="balloon-string" style="--sh:55px"></div></div>
    <div class="balloon" style="--dur:3.7s;--delay:1.3s;--tilt:-7deg"><svg width="52" height="66" viewBox="0 0 52 66"><ellipse cx="26" cy="27" rx="21" ry="25" fill="#818cf8"/><ellipse cx="19" cy="18" rx="6" ry="4" fill="rgba(255,255,255,.22)"/><path d="M26 52 Q24 60 26 64" stroke="rgba(255,255,255,.4)" stroke-width="1.5" fill="none"/></svg><div class="balloon-string" style="--sh:65px"></div></div>
  </div>

  <!-- TEDDY on page -->
  <div class="page-teddy">
    <svg width="160" height="180" viewBox="0 0 150 170">
      <circle cx="38" cy="36" r="20" fill="#b5793a"/><circle cx="112" cy="36" r="20" fill="#b5793a"/>
      <circle cx="38" cy="36" r="12" fill="#d4954a"/><circle cx="112" cy="36" r="12" fill="#d4954a"/>
      <circle cx="75" cy="66" r="42" fill="#b5793a"/><circle cx="75" cy="66" r="37" fill="#d4954a"/>
      <circle cx="60" cy="57" r="7" fill="#2c1a0e"/><circle cx="90" cy="57" r="7" fill="#2c1a0e"/>
      <circle cx="62" cy="54" r="2.5" fill="#fff"/><circle cx="92" cy="54" r="2.5" fill="#fff"/>
      <ellipse cx="75" cy="72" rx="9" ry="6" fill="#7a3e10"/>
      <circle cx="71" cy="71" r="2" fill="#5a2c08"/><circle cx="79" cy="71" r="2" fill="#5a2c08"/>
      <path d="M66 79 Q75 88 84 79" stroke="#5a2c08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="72" rx="9" ry="6" fill="#ff8fa3" opacity=".45"/>
      <ellipse cx="100" cy="72" rx="9" ry="6" fill="#ff8fa3" opacity=".45"/>
      <ellipse cx="75" cy="130" rx="34" ry="38" fill="#b5793a"/><ellipse cx="75" cy="130" rx="26" ry="28" fill="#d4954a"/>
      <ellipse cx="32" cy="125" rx="13" ry="20" fill="#b5793a" transform="rotate(-18 32 125)"/>
      <ellipse cx="118" cy="110" rx="13" ry="20" fill="#b5793a" transform="rotate(35 118 110)"/>
      <ellipse cx="57" cy="160" rx="14" ry="10" fill="#b5793a"/><ellipse cx="93" cy="160" rx="14" ry="10" fill="#b5793a"/>
      <path d="M69 118 C69 114 75 112 75 117 C75 112 81 114 81 118 C81 123 75 128 75 128Z" fill="#ff6b9d"/>
      <path d="M62 106 L70 112 L62 118 Z" fill="#ff6b9d"/>
      <path d="M88 106 L80 112 L88 118 Z" fill="#ff6b9d"/>
      <circle cx="75" cy="112" r="4" fill="#ff4081"/>
    </svg>
  </div>

  <div class="cake-big">🎂</div>

  <!-- stickers -->
  <div class="sticker" style="--fs:38px;--sd:4s;--ss:0s;--sr:-8deg;top:8%;left:8%">🎉</div>
  <div class="sticker" style="--fs:32px;--sd:5s;--ss:.8s;--sr:6deg;top:12%;right:12%">✨</div>
  <div class="sticker" style="--fs:40px;--sd:3.5s;--ss:1.5s;--sr:-5deg;top:6%;left:32%">🌸</div>
  <div class="sticker" style="--fs:34px;--sd:4.8s;--ss:.4s;--sr:10deg;top:10%;right:35%">🎊</div>
  <div class="sticker" style="--fs:28px;--sd:4.2s;--ss:2s;--sr:-12deg;top:18%;left:14%">⭐</div>
  <div class="sticker" style="--fs:36px;--sd:3.8s;--ss:1.2s;--sr:8deg;top:15%;right:8%">💫</div>
  <div class="sticker" style="--fs:30px;--sd:5.2s;--ss:.6s;--sr:-6deg;bottom:18%;left:6%">🎁</div>
  <div class="sticker" style="--fs:32px;--sd:4.5s;--ss:1.8s;--sr:5deg;bottom:14%;right:5%">🌟</div>
  <div class="sticker" style="--fs:26px;--sd:3.6s;--ss:2.4s;--sr:-10deg;bottom:24%;right:18%">💕</div>
  <div class="sticker" style="--fs:34px;--sd:4s;--ss:.2s;--sr:7deg;bottom:20%;left:20%">🎈</div>
  <div class="sticker" style="--fs:28px;--sd:5.5s;--ss:1s;--sr:-4deg;top:35%;left:4%">🍰</div>
  <div class="sticker" style="--fs:30px;--sd:4.3s;--ss:1.7s;--sr:9deg;top:35%;right:4%">💖</div>

  <!-- sparkles -->
  <div class="sparkle" style="--sd:2.8s;--ss:0s;top:22%;left:22%"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 0L11.5 8.5L20 10L11.5 11.5L10 20L8.5 11.5L0 10L8.5 8.5Z" fill="#c9a96e" opacity=".8"/></svg></div>
  <div class="sparkle" style="--sd:3.2s;--ss:.7s;top:28%;right:24%"><svg width="14" height="14" viewBox="0 0 20 20"><path d="M10 0L11.5 8.5L20 10L11.5 11.5L10 20L8.5 11.5L0 10L8.5 8.5Z" fill="#f9a8d4" opacity=".9"/></svg></div>
  <div class="sparkle" style="--sd:2.5s;--ss:1.4s;top:70%;left:28%"><svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 0L11.5 8.5L20 10L11.5 11.5L10 20L8.5 11.5L0 10L8.5 8.5Z" fill="#a78bfa" opacity=".85"/></svg></div>
  <div class="sparkle" style="--sd:3.5s;--ss:.3s;top:65%;right:26%"><svg width="18" height="18" viewBox="0 0 20 20"><path d="M10 0L11.5 8.5L20 10L11.5 11.5L10 20L8.5 11.5L0 10L8.5 8.5Z" fill="#fbbf24" opacity=".8"/></svg></div>

  <!-- center card -->
  <div class="center-card">
    <div class="card-inner">
      <div class="orn"><div class="orn-l"></div><div class="orn-d"></div><div class="orn-r"></div></div>
      <div class="card-sub">With all the love in the world</div>
      <div class="card-hb">Happy<br>Birthday</div>
      <div class="card-name">Qandeel</div>
      <div class="card-msg">May this day shower you with<br>joy, laughter, and every beautiful<br>thing your heart desires. 🌸</div>
      <div class="orn" style="margin-top:24px"><div class="orn-l"></div><div class="orn-d"></div><div class="orn-r"></div></div>
      <div class="card-date">June 29, 2026</div>
    </div>
  </div>

</div>

<script>
/* ── star bg ── */
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let W,H,stars=[];
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
for(let i=0;i<120;i++) stars.push({x:Math.random()*2000,y:Math.random()*1200,r:Math.random()*1.5+.3,a:Math.random(),s:Math.random()*.008+.003});
(function drawBg(){cx.clearRect(0,0,W,H);stars.forEach(s=>{s.a+=s.s;if(s.a>1)s.a=0;cx.beginPath();cx.arc((s.x/2000)*W,(s.y/1200)*H,s.r,0,Math.PI*2);cx.fillStyle=`rgba(255,255,255,${Math.abs(Math.sin(s.a*Math.PI))*.7})`;cx.fill();});requestAnimationFrame(drawBg);})();

/* ── confetti ── */
const COLS=['#ff6b9d','#c9a96e','#a78bfa','#34d399','#fbbf24','#60a5fa','#f87171','#f9a8d4','#fff'];
const cDiv=document.getElementById('confetti');
let cPieces=[];
class Conf{
  constructor(){this.el=document.createElement('div');this.reset(true);cDiv.appendChild(this.el);}
  reset(init){
    this.x=Math.random()*window.innerWidth;this.y=init?Math.random()*-window.innerHeight:-20;
    this.vx=(Math.random()-.5)*2.5;this.vy=Math.random()*2+1;this.rot=Math.random()*360;
    this.rotV=(Math.random()-.5)*6;this.w=6+Math.random()*10;this.h=4+Math.random()*6;
    this.color=COLS[Math.floor(Math.random()*COLS.length)];
    this.shape=Math.random()>.5?'circle':'rect';
    const s=this.el.style;s.position='absolute';s.width=this.w+'px';s.height=this.h+'px';
    s.background=this.color;s.borderRadius=this.shape==='circle'?'50%':'2px';s.opacity='.9';
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.rot+=this.rotV;this.vy+=.03;const s=this.el.style;s.left=this.x+'px';s.top=this.y+'px';s.transform=`rotate(${this.rot}deg)`;if(this.y>window.innerHeight+20)this.reset(false);}
}
function startConfetti(){if(cPieces.length)return;for(let i=0;i<90;i++)cPieces.push(new Conf());(function loop(){cPieces.forEach(c=>c.tick());requestAnimationFrame(loop);})();}

/* ════════════════════════════════
   TEDDY OPENING ANIMATION
════════════════════════════════ */
let opened=false;

function openCard(){
  if(opened)return;
  opened=true;

  const teddy  = document.getElementById('stageTeddy');
  const arm    = document.getElementById('armRight');
  const card   = document.getElementById('envCard');

  /* 1. teddy leans in and arm reaches out */
  teddy.style.animation='none';

  /* sequence via keyframe injection */
  const kf = document.createElement('style');
  kf.textContent=`
    @keyframes teddyLean{
      0%  {transform:translateY(0) rotate(-2deg)}
      20% {transform:translateY(-10px) rotate(-18deg) translateX(12px)}
      45% {transform:translateY(-16px) rotate(-22deg) translateX(18px)}
      65% {transform:translateY(-10px) rotate(-12deg) translateX(10px)}
      80% {transform:translateY(-4px) rotate(-5deg) translateX(4px)}
      100%{transform:translateY(0) rotate(-2deg) translateX(0)}
    }
    @keyframes armReach{
      0%  {transform:rotate(35deg)}
      30% {transform:rotate(90deg) translateX(10px) translateY(-8px)}
      55% {transform:rotate(110deg) translateX(14px) translateY(-10px)}
      75% {transform:rotate(70deg)}
      100%{transform:rotate(35deg)}
    }
    @keyframes cardJiggle{
      0%  {transform:rotate(0deg) scale(1)}
      20% {transform:rotate(-3deg) scale(1.03) translateX(6px)}
      40% {transform:rotate(2deg) scale(1.04) translateX(-4px)}
      60% {transform:rotate(-1.5deg) scale(1.03)}
      80% {transform:rotate(.5deg) scale(1.01)}
      100%{transform:rotate(0deg) scale(1)}
    }
  `;
  document.head.appendChild(kf);

  teddy.style.animation='teddyLean 1s cubic-bezier(.4,0,.2,1) forwards';
  arm.style.transformOrigin='112px 110px';
  arm.style.animation='armReach 1s cubic-bezier(.4,0,.2,1) forwards';
  card.style.animation='cardJiggle 1s cubic-bezier(.4,0,.2,1) forwards';
  card.style.cursor='default';

  /* 2. after teddy animation, card "rips" open — scale up then fly away */
  setTimeout(()=>{
    card.style.transition='transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s ease';
    card.style.transform='scale(1.08) rotate(-2deg)';
  }, 800);

  setTimeout(()=>{
    card.style.transform='scale(0) rotate(15deg)';
    card.style.opacity='0';
    teddy.style.transition='transform 0.4s ease, opacity 0.5s ease';
    teddy.style.transform='scale(1.1) translateY(-6px)';
  }, 1050);

  /* 3. fade stage, show page */
  setTimeout(()=>{
    document.getElementById('stage').classList.add('hide');
    document.body.classList.add('opened');
  }, 1300);

  setTimeout(()=>{
    document.getElementById('page').classList.add('visible');
    startConfetti();
  }, 1600);
}

document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')openCard();});
</script>
</body>
</html>
